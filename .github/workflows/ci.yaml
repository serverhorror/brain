name: ci
on:
  push:
    branches:
      - main
      - scratch/resulting-cow
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v6
      - name: "Set up UV"
        uses: astral-sh/setup-uv@v8.1.0
      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"
      - name: "Set up UV environment"
        run: |
          uv tree
          uv venv
          uv pip install --editable .
          # uv pip install mkdocs-material==5.5.12
          # uv pip install mkdocs-exclude
          # uv pip install mkdocs-roamlinks-plugin
          uv run mkdocs build
      - name: "Debug: List files in site directory"
        run: |
          find site/ -ls
      - name: "Build documentation"
        run: uv run mkdocs build
      - name: "Upload artifact"
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/
  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: "Deploy to GitHub Pages"
        id: deployment
        uses: actions/deploy-pages@v5
